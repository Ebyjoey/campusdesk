---
- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  register: dl
  retries: 5
  delay: 10
  until: dl is succeeded

- name: Install k3s server (Traefik and servicelb off to save memory)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_EXEC: >-
      server --write-kubeconfig-mode 644
      --node-ip {{ private_ip }} --advertise-address {{ private_ip }}
      --tls-san {{ ansible_host }}
      --disable traefik --disable servicelb

- name: Wait until the control plane reports Ready
  ansible.builtin.command: k3s kubectl get nodes --no-headers
  register: nodes
  until: nodes.rc == 0 and ' Ready' in nodes.stdout
  retries: 30
  delay: 10
  changed_when: false

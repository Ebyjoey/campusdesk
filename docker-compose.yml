# Local development only: the app plus a PostgreSQL 16 container.
# On AWS the database runs on its own EC2 instance and the app runs in Kubernetes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campusdesk
      POSTGRES_PASSWORD: localdevpass
      POSTGRES_DB: campusdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://campusdesk:localdevpass@db:5432/campusdesk
      SECRET_KEY: local-dev-secret
      FLASK_APP: wsgi.py
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade && flask seed &&
             gunicorn --workers 1 --threads 4 --bind 0.0.0.0:8000 wsgi:app"

volumes:
  pgdata:

name: CI/CD

# GitHub Actions is the quality gate and image publisher.
# Jenkins (on AWS) picks up the same commit and deploys it to Kubernetes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (fails below 80% coverage)
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80 --junitxml=test-results.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results.xml
            coverage.xml

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pinned packages for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  infra:
    name: Terraform and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format check (warning only)
        working-directory: terraform
        continue-on-error: true
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Validate Kubernetes manifests
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/

  docker:
    name: Build image and smoke test
    needs: [test, infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start app and PostgreSQL with Docker Compose
        run: docker compose up -d --build

      - name: Wait until the app is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz; then echo; exit 0; fi
            sleep 3
          done
          echo "App did not become ready"; exit 1

      - name: Smoke test login and metrics
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"student@campusdesk.in","password":"ChangeMe123!"}'
          echo
          curl -fsS http://localhost:8080/metrics | grep campusdesk_complaints_open

      - name: App logs
        if: always()
        run: docker compose logs web

      - name: Stop containers
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to Docker Hub
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "Docker Hub secrets are not set, so the image was not published." >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3
        if: env.HAS_DOCKERHUB == 'true'

      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: env.HAS_DOCKERHUB == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/campusdesk:gh-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
